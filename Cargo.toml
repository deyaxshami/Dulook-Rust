[package]
name = "dulook"
version = "3.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Backend for the Dulook Omarchy Shell plugin"

[lib]
path = "src/lib.rs"

[[bin]]
name = "dulook"
path = "src/main.rs"

[[bin]]
name = "dulook-data"
path = "src/bin/dulook-data.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
fastrand = "2"
libc = "0.2"
percent-encoding = "2"
sha2 = "0.10"
unicode-normalization = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
